name: ciro_app
description: "Crisis Intelligence & Response Orchestrator mobile app"
publish_to: 'none' # private
version: 1.0.0+1
environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_maps_flutter: ^2.5.0
  firebase_core: ^2.24.0
  firebase_auth: ^4.12.0
  cloud_firestore: ^4.14.0
  flutter_riverpod: ^2.4.10
  go_router: ^12.1.1
  animations: ^2.0.8
  flutter_svg: ^2.0.9
  intl: ^0.18.1
  uuid: ^4.2.2
  permission_handler: ^11.3.0
  image_picker: ^1.0.5
  voice_processing: ^0.1.0 # placeholder for voice input
  # Add more as needed

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
